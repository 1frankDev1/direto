<!DOCTYPE html>
<html data-bs-theme="light" lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Web Builder - Tragalero</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto:wght@400;500&family=Rubik:wght@400;500;600;700&family=Shadows+Into+Light&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/pastel-theme.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }

        /* Builder Layout */
        .builder-container {
            display: flex;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        .designer-sidebar {
            width: 450px;
            min-width: 450px;
            background: white;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .preview-area {
            flex-grow: 1;
            background: #e9ecef;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        .preview-frame {
            width: 100%;
            max-width: 1200px;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            min-height: 100%;
            transform-origin: top center;
            transition: transform 0.3s ease;
        }

        .preview-controls {
            position: sticky;
            top: -20px;
            background: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            z-index: 50;
            display: flex;
            gap: 15px;
        }

        /* Designer Components */
        .designer-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .accordion-button:not(.collapsed) {
            background-color: rgba(var(--bs-primary-rgb), 0.1);
            color: var(--bs-primary);
        }

        .designer-section {
            padding: 15px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #6c757d;
        }

        .upload-drop-zone {
            border: 2px dashed #dee2e6;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 15px;
        }

        .upload-drop-zone:hover {
            border-color: var(--bs-primary);
            background: rgba(var(--bs-primary-rgb), 0.02);
        }

        .upload-drop-zone i {
            font-size: 1.5rem;
            color: #adb5bd;
            display: block;
            margin-bottom: 8px;
        }

        .list-item-editor {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .list-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            cursor: move;
        }

        .drag-handle {
            color: #dee2e6;
            font-size: 1.2rem;
        }

        .item-actions {
            display: flex;
            gap: 5px;
        }

        /* Responsive Previews */
        .preview-mobile { width: 375px; }
        .preview-tablet { width: 768px; }
        .preview-desktop { width: 100%; max-width: 1200px; }

        /* Loader */
        #loadingOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <div id="loadingOverlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg border-bottom bg-white" style="height: 60px;">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="./admin.html">
                <img src="https://tragalero.com/assets/img/tragalero.png" alt="Tragalero" height="35" class="me-2">
                <span class="fw-bold fs-5">Web Builder</span>
            </a>
            <div class="ms-auto d-flex align-items-center">
                <div id="authButtons" class="me-3"></div>
                <div class="btn-group me-2">
                    <button class="btn btn-primary fw-bold" id="saveWebBtn" onclick="saveWebsite()">
                        <i class="bi bi-cloud-arrow-up me-2"></i>Guardar
                    </button>
                </div>
                <button class="btn btn-dark fw-bold" id="shareBtn" onclick="shareWebsite()">
                    <i class="bi bi-share me-2"></i>Compartir
                </button>
            </div>
        </div>
    </nav>

    <div class="builder-container">
        <!-- Sidebar -->
        <div class="designer-sidebar">
            <div class="designer-header">
                <h6 class="fw-bold mb-1">Editor de Sitio Web</h6>
                <div class="mb-0">
                    <label class="form-label small mb-1">Seleccionar Plantilla</label>
                    <select class="form-select form-select-sm" id="selectTemplate" onchange="changeTemplate(this.value)">
                        <option value="template1.html">Foodie (Plantilla 1)</option>
                    </select>
                </div>
            </div>

            <div class="accordion accordion-flush" id="builderAccordion">
                <!-- General Settings -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseGeneral">
                            <i class="bi bi-gear me-2"></i> Configuración General
                        </button>
                    </h2>
                    <div id="collapseGeneral" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div class="mb-3">
                                <label class="form-label">Menutech CUID</label>
                                <input type="text" class="form-control" id="inputGeneralCUID" oninput="updateConfig('general.cuid', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Menutech RUID</label>
                                <input type="text" class="form-control" id="inputGeneralRUID" oninput="updateConfig('general.ruid', this.value)">
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="inputGeneralHasRes" onchange="updateConfig('general.hasReservation', this.checked)">
                                <label class="form-check-label">Habilitar Reservas</label>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label">Fondo Botón</label>
                                    <input type="color" class="form-control form-control-color w-100" id="inputOrderBgColor" value="#ff9d2d" oninput="updateConfig('general.orderBgColor', this.value)">
                                </div>
                                <div class="col-6">
                                    <label class="form-label">Texto Botón</label>
                                    <input type="color" class="form-control form-control-color w-100" id="inputOrderTextColor" value="#ffffff" oninput="updateConfig('general.orderTextColor', this.value)">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Header -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseHeader">
                            <i class="bi bi-layout-text-window me-2"></i> Cabecera & Logo
                        </button>
                    </h2>
                    <div id="collapseHeader" class="accordion-collapse collapse show" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div class="mb-3">
                                <label class="form-label">Nombre/Logo</label>
                                <input type="text" class="form-control" id="inputHeaderLogo" oninput="updateConfig('header.logo', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Texto Botón Pedido</label>
                                <input type="text" class="form-control" id="inputHeaderBtn" oninput="updateConfig('header.btnText', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Texto Botón Reserva</label>
                                <input type="text" class="form-control" id="inputHeaderResBtn" oninput="updateConfig('header.resBtnText', this.value)">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Hero -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseHero">
                            <i class="bi bi-stars me-2"></i> Hero / Portada
                        </button>
                    </h2>
                    <div id="collapseHero" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div class="mb-3">
                                <label class="form-label">Subtítulo</label>
                                <input type="text" class="form-control" id="inputHeroSubtitle" oninput="updateConfig('hero.subtitle', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Título Principal</label>
                                <input type="text" class="form-control" id="inputHeroTitle" oninput="updateConfig('hero.title', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control" id="inputHeroText" rows="2" oninput="updateConfig('hero.text', this.value)"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Imagen de Fondo</label>
                                <div class="upload-drop-zone" onclick="triggerUpload('hero.bgImg')">
                                    <i class="bi bi-image"></i>
                                    <span class="small">Cambiar fondo</span>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Imagen Principal (PNG)</label>
                                <div class="upload-drop-zone" onclick="triggerUpload('hero.bannerImg')">
                                    <i class="bi bi-image"></i>
                                    <span class="small">Cambiar banner</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Promo -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePromo">
                            <i class="bi bi-tag me-2"></i> Promociones
                        </button>
                    </h2>
                    <div id="collapsePromo" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div id="promoListContainer"></div>
                            <button class="btn btn-sm btn-outline-primary w-100" onclick="addItem('promos')">
                                <i class="bi bi-plus-lg me-1"></i> Añadir Promoción
                            </button>
                        </div>
                    </div>
                </div>

                <!-- About -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAbout">
                            <i class="bi bi-info-circle me-2"></i> Sobre Nosotros
                        </button>
                    </h2>
                    <div id="collapseAbout" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div class="mb-3">
                                <label class="form-label">Título</label>
                                <input type="text" class="form-control" id="inputAboutTitle" oninput="updateConfig('about.title', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Texto</label>
                                <textarea class="form-control" id="inputAboutText" rows="3" oninput="updateConfig('about.text', this.value)"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Imagen</label>
                                <div class="upload-drop-zone" onclick="triggerUpload('about.img')">
                                    <i class="bi bi-image"></i>
                                    <span class="small">Cambiar imagen</span>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Características</label>
                                <div id="aboutFeaturesContainer"></div>
                                <button class="btn btn-sm btn-outline-primary w-100" onclick="addItem('aboutFeatures')">
                                    <i class="bi bi-plus-lg me-1"></i> Añadir Característica
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Menu -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseMenu">
                            <i class="bi bi-journal-richtext me-2"></i> Menú de Comida
                        </button>
                    </h2>
                    <div id="collapseMenu" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div class="mb-3">
                                <label class="form-label">Subtítulo</label>
                                <input type="text" class="form-control" id="inputMenuSubtitle" oninput="updateConfig('menu.subtitle', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Título</label>
                                <input type="text" class="form-control" id="inputMenuTitle" oninput="updateConfig('menu.title', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Texto Sección</label>
                                <textarea class="form-control" id="inputMenuText" rows="2" oninput="updateConfig('menu.text', this.value)"></textarea>
                            </div>
                            <div id="menuListContainer"></div>
                            <button class="btn btn-sm btn-outline-primary w-100" onclick="addItem('menu')">
                                <i class="bi bi-plus-lg me-1"></i> Añadir Plato
                            </button>
                        </div>
                    </div>
                </div>

                <!-- CTA -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCTA">
                            <i class="bi bi-megaphone me-2"></i> Call to Action
                        </button>
                    </h2>
                    <div id="collapseCTA" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div class="mb-3">
                                <label class="form-label">Título</label>
                                <input type="text" class="form-control" id="inputCTATitle" oninput="updateConfig('cta.title', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Texto</label>
                                <textarea class="form-control" id="inputCTAText" rows="2" oninput="updateConfig('cta.text', this.value)"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Imagen de Fondo</label>
                                <div class="upload-drop-zone" onclick="triggerUpload('cta.bgImg')">
                                    <i class="bi bi-image"></i>
                                    <span class="small">Cambiar fondo</span>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Imagen Principal</label>
                                <div class="upload-drop-zone" onclick="triggerUpload('cta.bannerImg')">
                                    <i class="bi bi-image"></i>
                                    <span class="small">Cambiar banner</span>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Insignia Oferta (badge)</label>
                                <div class="upload-drop-zone" onclick="triggerUpload('cta.saleImg')">
                                    <i class="bi bi-image"></i>
                                    <span class="small">Cambiar badge</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Delivery -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDelivery">
                            <i class="bi bi-truck me-2"></i> Delivery
                        </button>
                    </h2>
                    <div id="collapseDelivery" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div class="mb-3">
                                <label class="form-label">Título</label>
                                <input type="text" class="form-control" id="inputDeliveryTitle" oninput="updateConfig('delivery.title', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Texto</label>
                                <textarea class="form-control" id="inputDeliveryText" rows="2" oninput="updateConfig('delivery.text', this.value)"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Imagen Nubes (fondo)</label>
                                <div class="upload-drop-zone" onclick="triggerUpload('delivery.bannerImg')">
                                    <i class="bi bi-image"></i>
                                    <span class="small">Cambiar fondo</span>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Repartidor (SVG/PNG)</label>
                                <div class="upload-drop-zone" onclick="triggerUpload('delivery.boyImg')">
                                    <i class="bi bi-image"></i>
                                    <span class="small">Cambiar repartidor</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Testimonials -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTestimonials">
                            <i class="bi bi-chat-quote me-2"></i> Testimonios
                        </button>
                    </h2>
                    <div id="collapseTestimonials" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div class="mb-3">
                                <label class="form-label">Subtítulo</label>
                                <input type="text" class="form-control" id="inputTestiSubtitle" oninput="updateConfig('testimonials.subtitle', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Título</label>
                                <input type="text" class="form-control" id="inputTestiTitle" oninput="updateConfig('testimonials.title', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Texto Sección</label>
                                <textarea class="form-control" id="inputTestiText" rows="2" oninput="updateConfig('testimonials.text', this.value)"></textarea>
                            </div>
                            <div id="testiListContainer"></div>
                            <button class="btn btn-sm btn-outline-primary w-100" onclick="addItem('testimonials')">
                                <i class="bi bi-plus-lg me-1"></i> Añadir Testimonio
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Banners -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseBanners">
                            <i class="bi bi-images me-2"></i> Banners
                        </button>
                    </h2>
                    <div id="collapseBanners" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div id="bannerListContainer"></div>
                            <button class="btn btn-sm btn-outline-primary w-100" onclick="addItem('banners')">
                                <i class="bi bi-plus-lg me-1"></i> Añadir Banner
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Blog -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseBlog">
                            <i class="bi bi-newspaper me-2"></i> Blog
                        </button>
                    </h2>
                    <div id="collapseBlog" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div class="mb-3">
                                <label class="form-label">Subtítulo</label>
                                <input type="text" class="form-control" id="inputBlogSubtitle" oninput="updateConfig('blog.subtitle', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Título</label>
                                <input type="text" class="form-control" id="inputBlogTitle" oninput="updateConfig('blog.title', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Texto Sección</label>
                                <textarea class="form-control" id="inputBlogText" rows="2" oninput="updateConfig('blog.text', this.value)"></textarea>
                            </div>
                            <div id="blogListContainer"></div>
                            <button class="btn btn-sm btn-outline-primary w-100" onclick="addItem('blog')">
                                <i class="bi bi-plus-lg me-1"></i> Añadir Post
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseFooter">
                            <i class="bi bi-info-square me-2"></i> Pie de Página
                        </button>
                    </h2>
                    <div id="collapseFooter" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div class="mb-3">
                                <label class="form-label">Texto Footer</label>
                                <textarea class="form-control" id="inputFooterText" rows="2" oninput="updateConfig('footer.text', this.value)"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="text" class="form-control" id="inputFooterEmail" oninput="updateConfig('footer.email', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Teléfono</label>
                                <input type="text" class="form-control" id="inputFooterPhone" oninput="updateConfig('footer.phone', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="inputFooterAddress" oninput="updateConfig('footer.address', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Redes Sociales</label>
                                <div class="input-group input-group-sm mb-2">
                                    <span class="input-group-text"><i class="bi bi-facebook"></i></span>
                                    <input type="text" class="form-control" id="inputFooterFb" oninput="updateConfig('footer.social.facebook', this.value)">
                                </div>
                                <div class="input-group input-group-sm mb-2">
                                    <span class="input-group-text"><i class="bi bi-twitter"></i></span>
                                    <input type="text" class="form-control" id="inputFooterTw" oninput="updateConfig('footer.social.twitter', this.value)">
                                </div>
                                <div class="input-group input-group-sm mb-2">
                                    <span class="input-group-text"><i class="bi bi-instagram"></i></span>
                                    <input type="text" class="form-control" id="inputFooterIg" oninput="updateConfig('footer.social.instagram', this.value)">
                                </div>
                                <div class="input-group input-group-sm mb-2">
                                    <span class="input-group-text"><i class="bi bi-pinterest"></i></span>

        function escapeHtml(text) {
            if (typeof text !== 'string') return text;
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sanitizeUrl(url) {
            if (!url) return '';
            const trimmed = url.trim();
            if (trimmed.startsWith('javascript:') || trimmed.startsWith('data:text/html')) {
                return '';
            }
            return trimmed.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function sanitizeSvg(svgString) {
            if (!svgString) return '';
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(svgString, 'image/svg+xml');
                const errorNode = doc.querySelector('parsererror');
                if (errorNode) return '';

                const svg = doc.querySelector('svg');
                if (!svg) return '';

                // Basic sanitation: remove scripts and event handlers
                const scripts = svg.querySelectorAll('script');
                scripts.forEach(s => s.remove());

                const allElements = [svg, ...svg.querySelectorAll('*')];
                allElements.forEach(el => {
                    const attrs = el.attributes;
                    for (let i = attrs.length - 1; i >= 0; i--) {
                        const attrName = attrs[i].name.toLowerCase();
                        const attrValue = attrs[i].value.toLowerCase();
                        if (attrName.startsWith('on') ||
                            (attrName.includes('href') && attrValue.includes('javascript:'))) {
                            el.removeAttribute(attrs[i].name);
                        }
                    }
                });
                return svg.outerHTML;
            } catch (e) {
                console.error("SVG Sanitize error:", e);
                return '';
            }
        }

                const url = await uploadToCloudinary(file);
                updateConfig(uploadTarget, url);
                renderDesigner();
            } catch (err) {

        async function uploadToCloudinary(file) {
            const user = getLoggedInUser();
            const CLOUD_NAME = "dbbjxhvz5";
            const UPLOAD_PRESET = "Tragalero";
            const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`;
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('folder', `websites/${user?.id || 'anonymous'}`);
            const response = await fetch(url, { method: 'POST', body: formData });
            if (!response.ok) throw new Error("Cloudinary error");
            const data = await response.json();
            return data.secure_url;
        }

        function initSortable() {
            ['promoListContainer', 'menuListContainer', 'testiListContainer', 'aboutFeaturesContainer', 'bannerListContainer', 'blogListContainer', 'footerHoursContainer'].forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    new Sortable(el, {
                        handle: '.drag-handle',
                        animation: 150,
                        onEnd: (evt) => {
                            let type = id.replace('ListContainer', '').replace('FeaturesContainer', 'Features');
                            if(type === 'promo') type = 'promos';
                            if(type === 'banner') type = 'banners';

                            if(type === 'aboutFeatures') {
                                const item = webConfig.about.features.splice(evt.oldIndex, 1)[0];
                                webConfig.about.features.splice(evt.newIndex, 0, item);
                            } else if (type === 'footerHours') {
                                const item = webConfig.footer.hours.splice(evt.oldIndex, 1)[0];
                                webConfig.footer.hours.splice(evt.newIndex, 0, item);
                            } else if (['menu', 'testimonials', 'blog'].includes(type)) {
                                const item = webConfig[type].items.splice(evt.oldIndex, 1)[0];
                                webConfig[type].items.splice(evt.newIndex, 0, item);
                            } else {
                                const item = webConfig[type].splice(evt.oldIndex, 1)[0];
                                webConfig[type].splice(evt.newIndex, 0, item);
                            }
                            renderDesigner();
                            renderPreview();
                        }
                    });
                }
            });
        }

        function renderPreview() {
            const iframe = document.getElementById('templateIframe');
            // If template changed or not loaded yet
            if (iframe.src.indexOf(webConfig.template) === -1) {
                iframe.src = 'templates/' + webConfig.template;
                iframe.onload = () => {
                    // Give a tiny bit of time for internal scripts to initialize if needed
                    setTimeout(injectDataIntoTemplate, 100);
                };
            } else {
                injectDataIntoTemplate();
            }
        }

                { id: 'collapseFooter', trigger: 'footer-section' }
            ];

            sections.forEach(s => {
                const accordionItem = document.getElementById(s.id)?.closest('.accordion-item');
                if(!accordionItem) return;
                if(!s.trigger || doc.getElementById(s.trigger)) {
                    accordionItem.style.display = 'block';
                } else {
                    accordionItem.style.display = 'none';
                }
            });
        }

        async function saveWebsite() {
            const user = getLoggedInUser();
            const btn = document.getElementById('saveWebBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Guardando...';

            try {
                const { error } = await supabaseClient
                    .from('user_websites')
                    .upsert([{ user_id: user.id, config: webConfig }], { onConflict: 'user_id' });

                if (error) throw error;
                alert("Sitio web guardado con éxito");
            } catch (err) {
                console.error("Error saving website:", err);
                alert("Error al guardar: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-cloud-arrow-up me-2"></i>Guardar';
            }
        }

        async function loadWebsite() {
            const targetId = viewUserId || getLoggedInUser()?.id;
            if (!targetId) return;

            try {
                const { data, error } = await supabaseClient
                    .from('user_websites')
                    .select('config')
                    .eq('user_id', targetId)
                    .single();

                if (data && data.config) {
                    webConfig = data.config;
                    if (!isViewOnly) renderDesigner();
                    renderPreview();
                }
            } catch (err) {
                console.error("Error loading website:", err);
            }
        }

        function shareWebsite() {
            const user = getLoggedInUser();
            const publicUrl = window.location.origin + window.location.pathname + '?user=' + user.id;
            prompt("Copia este enlace para compartir tu sitio web:", publicUrl);
        }

        function changeTemplate(val) {
            webConfig.template = val;
            renderPreview();
        }


        window.addEventListener('message', (event) => {
            if (event.data.type === 'selectSection') {
                const sectionId = event.data.section;
                const mapping = {
                    'header': 'collapseHeader',
                    'home': 'collapseHero',
                    'promos': 'collapsePromo',
                    'about': 'collapseAbout',
                    'food-menu': 'collapseMenu',
                    'cta': 'collapseCTA',
                    'delivery': 'collapseDelivery',
                    'testimonials': 'collapseTestimonials',
                    'banners': 'collapseBanners',
                    'blog': 'collapseBlog',
                    'footer': 'collapseFooter'
                };

                const accordionId = mapping[sectionId] || ('collapse' + sectionId.charAt(0).toUpperCase() + sectionId.slice(1));
                const collapseEl = document.getElementById(accordionId);
                if (collapseEl) {
                    const bsCollapse = bootstrap.Collapse.getOrCreateInstance(collapseEl);
                    bsCollapse.show();
                    collapseEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

                    // Highlight the section briefly
                    const originalBg = collapseEl.style.backgroundColor;
                    collapseEl.style.backgroundColor = '#fff3cd';
                    setTimeout(() => { collapseEl.style.backgroundColor = originalBg; }, 1000);
                }
            }
        });

        window.onload = async () => {
            try {
                const user = getLoggedInUser();
                if (!isViewOnly && !user) {
                    window.location.href = './login.html';
                    return;
                }

                if (isViewOnly) {
                    const sidebar = document.querySelector('.designer-sidebar');
                    if (sidebar) sidebar.style.display = 'none';
                    const controls = document.getElementById('previewControls');
                    if (controls) controls.style.display = 'none';
                    document.querySelector('.preview-area').style.padding = '0';
                    document.getElementById('previewFrame').style.maxWidth = '100%';
                    document.getElementById('previewFrame').style.borderRadius = '0';
                    const nav = document.querySelector('nav');
                    if (nav) nav.style.display = 'none';
                    document.body.style.backgroundColor = 'white';
                } else {
                    renderUserMenu('authButtons');
                }

                await loadWebsite();
                if(document.getElementById('selectTemplate')) {
                    document.getElementById('selectTemplate').value = webConfig.template;
                }
                renderDesigner();
                renderPreview();
            } catch (err) {
                console.error("Initialization error:", err);
            } finally {
                const overlay = document.getElementById('loadingOverlay');
                if (overlay) overlay.style.display = 'none';
            }
        }
    </script>
</body>

</html>
