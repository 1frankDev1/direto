<!DOCTYPE html>
<html data-bs-theme="light" lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Web Builder - Tragalero</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto:wght@400;500&family=Rubik:wght@400;500;600;700&family=Shadows+Into+Light&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/pastel-theme.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }

        /* Builder Layout */
        .builder-container {
            display: flex;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        .designer-sidebar {
            width: 450px;
            min-width: 450px;
            background: white;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .preview-area {
            flex-grow: 1;
            background: #e9ecef;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        .preview-frame {
            width: 100%;
            max-width: 1200px;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            min-height: 100%;
            transform-origin: top center;
            transition: transform 0.3s ease;
        }

        .preview-controls {
            position: sticky;
            top: -20px;
            background: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            z-index: 50;
            display: flex;
            gap: 15px;
        }

        /* Designer Components */
        .designer-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .accordion-button:not(.collapsed) {
            background-color: rgba(var(--bs-primary-rgb), 0.1);
            color: var(--bs-primary);
        }

        .designer-section {
            padding: 15px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #6c757d;
        }

        .upload-drop-zone {
            border: 2px dashed #dee2e6;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 15px;
        }

        .upload-drop-zone:hover {
            border-color: var(--bs-primary);
            background: rgba(var(--bs-primary-rgb), 0.02);
        }

        .upload-drop-zone i {
            font-size: 1.5rem;
            color: #adb5bd;
            display: block;
            margin-bottom: 8px;
        }

        .list-item-editor {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .list-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            cursor: move;
        }

        .drag-handle {
            color: #dee2e6;
            font-size: 1.2rem;
        }

        .item-actions {
            display: flex;
            gap: 5px;
        }

        /* Responsive Previews */
        .preview-mobile { width: 375px; }
        .preview-tablet { width: 768px; }
        .preview-desktop { width: 100%; max-width: 1200px; }

        /* Loader */
        #loadingOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <div id="loadingOverlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg border-bottom bg-white" style="height: 60px;">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="./admin.html">
                <img src="https://tragalero.com/assets/img/tragalero.png" alt="Tragalero" height="35" class="me-2">
                <span class="fw-bold fs-5">Web Builder</span>
            </a>
            <div class="ms-auto d-flex align-items-center">
                <div id="authButtons" class="me-3"></div>
                <div class="btn-group me-2">
                    <button class="btn btn-primary fw-bold" id="saveWebBtn" onclick="saveWebsite()">
                        <i class="bi bi-cloud-arrow-up me-2"></i>Guardar
                    </button>
                </div>
                <button class="btn btn-dark fw-bold" id="shareBtn" onclick="shareWebsite()">
                    <i class="bi bi-share me-2"></i>Compartir
                </button>
            </div>
        </div>
    </nav>

    <div class="builder-container">
        <!-- Sidebar -->
        <div class="designer-sidebar">
            <div class="designer-header">
                <h6 class="fw-bold mb-1">Editor de Sitio Web</h6>
                <p class="text-muted small mb-0">Template: <strong>Foodie</strong></p>
            </div>

            <div class="accordion accordion-flush" id="builderAccordion">
                <!-- Header -->
                <div class="accordion-item">
                    <h2 class="accordion-header">

                    <div id="collapseHeader" class="accordion-collapse collapse show" data-bs-parent="#builderAccordion">

                            <div class="mb-3">
                                <label class="form-label">Nombre/Logo</label>
                                <input type="text" class="form-control" id="inputHeaderLogo" oninput="updateConfig('header.logo', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Texto Botón</label>
                                <input type="text" class="form-control" id="inputHeaderBtn" oninput="updateConfig('header.btnText', this.value)">

                    </div>

                <!-- Hero -->

                    <div id="collapseHero" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">

                            </div>
                            <div class="mb-3">
                                <label class="form-label">Título Principal</label>

                            </div>

                            </div>
                            <div class="mb-3">

                                <div class="upload-drop-zone" onclick="triggerUpload('hero.bgImg')">

                <!-- Promo -->

                    <div id="collapsePromo" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">

                            <div id="promoListContainer"></div>

                                <i class="bi bi-plus-lg me-1"></i> Añadir Promoción
                            </button>
                        </div>
                    </div>
                </div>

                <!-- About -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAbout">
                            <i class="bi bi-info-circle me-2"></i> Sobre Nosotros
                        </button>
                    </h2>
                    <div id="collapseAbout" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div class="mb-3">
                                <label class="form-label">Título</label>
                                <input type="text" class="form-control" id="inputAboutTitle" oninput="updateConfig('about.title', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Texto</label>
                                <textarea class="form-control" id="inputAboutText" rows="3" oninput="updateConfig('about.text', this.value)"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Imagen</label>

                            <div class="mb-3">

                                <div id="aboutFeaturesContainer"></div>
                                <button class="btn btn-sm btn-outline-primary w-100" onclick="addItem('aboutFeatures')">
                                    <i class="bi bi-plus-lg me-1"></i> Añadir Característica
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Menu -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseMenu">
                            <i class="bi bi-journal-richtext me-2"></i> Menú de Comida
                        </button>
                    </h2>
                    <div id="collapseMenu" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div id="menuListContainer"></div>
                            <button class="btn btn-sm btn-outline-primary w-100" onclick="addItem('menu')">
                                <i class="bi bi-plus-lg me-1"></i> Añadir Plato
                            </button>
                        </div>
                    </div>
                </div>

                <!-- CTA -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseCTA">
                            <i class="bi bi-megaphone me-2"></i> Call to Action
                        </button>
                    </h2>
                    <div id="collapseCTA" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div class="mb-3">
                                <label class="form-label">Título</label>
                                <input type="text" class="form-control" id="inputCTATitle" oninput="updateConfig('cta.title', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Texto</label>
                                <textarea class="form-control" id="inputCTAText" rows="2" oninput="updateConfig('cta.text', this.value)"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Imagen</label>
                                <div class="upload-drop-zone" onclick="triggerUpload('cta.img')">
                                    <i class="bi bi-image"></i>
                                    <span class="small">Cambiar imagen</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Delivery -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDelivery">
                            <i class="bi bi-truck me-2"></i> Delivery
                        </button>
                    </h2>
                    <div id="collapseDelivery" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div class="mb-3">
                                <label class="form-label">Título</label>
                                <input type="text" class="form-control" id="inputDeliveryTitle" oninput="updateConfig('delivery.title', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Texto</label>
                                <textarea class="form-control" id="inputDeliveryText" rows="2" oninput="updateConfig('delivery.text', this.value)"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Testimonials -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTestimonials">
                            <i class="bi bi-chat-quote me-2"></i> Testimonios
                        </button>
                    </h2>
                    <div id="collapseTestimonials" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div id="testiListContainer"></div>
                            <button class="btn btn-sm btn-outline-primary w-100" onclick="addItem('testimonials')">
                                <i class="bi bi-plus-lg me-1"></i> Añadir Testimonio
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Banners -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseBanners">
                            <i class="bi bi-images me-2"></i> Banners
                        </button>
                    </h2>
                    <div id="collapseBanners" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div id="bannerListContainer"></div>
                            <button class="btn btn-sm btn-outline-primary w-100" onclick="addItem('banners')">
                                <i class="bi bi-plus-lg me-1"></i> Añadir Banner
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Blog -->

                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseBlog">
                            <i class="bi bi-newspaper me-2"></i> Blog
                        </button>
                    </h2>
                    <div id="collapseBlog" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div id="blogListContainer"></div>
                            <button class="btn btn-sm btn-outline-primary w-100" onclick="addItem('blog')">
                                <i class="bi bi-plus-lg me-1"></i> Añadir Post
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseFooter">
                            <i class="bi bi-info-square me-2"></i> Pie de Página
                        </button>
                    </h2>
                    <div id="collapseFooter" class="accordion-collapse collapse" data-bs-parent="#builderAccordion">
                        <div class="designer-section">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="text" class="form-control" id="inputFooterEmail" oninput="updateConfig('footer.email', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Teléfono</label>
                                <input type="text" class="form-control" id="inputFooterPhone" oninput="updateConfig('footer.phone', this.value)">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="inputFooterAddress" oninput="updateConfig('footer.address', this.value)">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <input type="file" id="globalUpload" style="display:none;" onchange="handleGlobalUpload(this)">
        </div>

        <!-- Preview -->
        <div class="preview-area">
            <div class="preview-controls" id="previewControls">
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 active" onclick="setPreviewSize('desktop', this)">
                    <i class="bi bi-laptop me-1"></i> Desktop
                </button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="setPreviewSize('tablet', this)">
                    <i class="bi bi-tablet me-1"></i> Tablet
                </button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="setPreviewSize('mobile', this)">
                    <i class="bi bi-phone me-1"></i> Mobile
                </button>
            </div>

            <div class="preview-frame" id="previewFrame">
                <iframe id="templateIframe" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="./assets/js/theme.js"></script>
    <script src="./assets/js/supabase_logic.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const viewUserId = urlParams.get('user');
        const isViewOnly = !!viewUserId;

        // Default Config
        let webConfig = {
            template: 'foodie',
            header: { logo: 'Foodie', btnText: 'Order Now' },
            hero: {
                subtitle: 'Eat Sleep And',
                title: 'Supper delicious Burger in town!',
                text: 'Food is any substance consumed to provide nutritional support for an organism.',
                bgImg: 'https://codewithsadee.github.io/foodie/assets/images/hero-bg.jpg',
                bannerImg: 'https://codewithsadee.github.io/foodie/assets/images/hero-banner.png'
            },
            promos: [
                { title: 'Mexican Pizza', text: 'Food is any substance consumed to provide nutritional support for an organism.', img: 'https://codewithsadee.github.io/foodie/assets/images/promo-1.png' },
                { title: 'Soft Drinks', text: 'Food is any substance consumed to provide nutritional support for an organism.', img: 'https://codewithsadee.github.io/foodie/assets/images/promo-2.png' },
                { title: 'French Fry', text: 'Food is any substance consumed to provide nutritional support for an organism.', img: 'https://codewithsadee.github.io/foodie/assets/images/promo-3.png' }
            ],
            about: {
                title: 'Caferio, Burgers, and Best Pizzas in Town!',
                text: 'The restaurants in Hangzhou also catered to many northern Chinese who had fled south from Kaifeng during the Jurchen invasion of the 1120s, while it is also known that many restaurants were run by families.',
                img: 'https://codewithsadee.github.io/foodie/assets/images/about-banner.png',
                features: ['Delicious & Healthy Foods', 'Spacific Family And Kids Zone', 'Music & Other Facilities', 'Fastest Food Home Delivery']
            },
            menu: [
                { title: 'Fried Chicken Unlimited', category: 'Chicken', price: '49.00', oldPrice: '69.00', img: 'https://codewithsadee.github.io/foodie/assets/images/food-menu-1.png', badge: '-15%' },
                { title: 'Burger King Whopper', category: 'Noddles', price: '29.00', oldPrice: '39.00', img: 'https://codewithsadee.github.io/foodie/assets/images/food-menu-2.png', badge: '-10%' }
            ],
            cta: {
                title: 'The Foodie Have Excellent Of Quality Burgers!',
                text: 'The restaurants in Hangzhou also catered to many northern Chinese who had fled south from Kaifeng during the Jurchen invasion of the 1120s.',
                img: 'https://codewithsadee.github.io/foodie/assets/images/cta-banner.png'
            },
            delivery: {
                title: 'A Moments Of Delivered On Right Time & Place',
                text: 'The restaurants in Hangzhou also catered to many northern Chinese who had fled south from Kaifeng during the Jurchen invasion of the 1120s.'
            },
            testimonials: [
                { name: 'Robert William', title: 'CEO Kingfisher', text: 'I would be lost without restaurant. I would like to personally thank you for your outstanding product.', img: 'https://codewithsadee.github.io/foodie/assets/images/avatar-1.jpg' }
            ],
            banners: [
                { subtitle: '50% Off Now!', title: 'Discount For Delicious Tasty Burgers!', text: 'Sale off 50% only this week', img: 'https://codewithsadee.github.io/foodie/assets/images/banner-1.jpg', size: 'lg' }
            ],
            blog: [
                { title: 'What Do You Think About Cheese Pizza Recipes?', text: 'Financial experts support or help you to find out which way you can raise your funds more...', date: 'Jan 01 2022', author: 'Jonathan Smith', category: 'Pizza', img: 'https://codewithsadee.github.io/foodie/assets/images/blog-1.jpg' }
            ],
            footer: { email: 'Info@YourGmail24.com', phone: '+1 (062) 109-9222', address: '153 Williamson Plaza, Maggieberg, MT 09514' }
        };

        let uploadTarget = null;

        function escapeHtml(text) {
            if (typeof text !== 'string') return text;
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setPreviewSize(size, btn) {
            const frame = document.getElementById('previewFrame');
            frame.className = 'preview-frame preview-' + size;
            document.querySelectorAll('.preview-controls button').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }

        function updateConfig(path, value) {
            const keys = path.split('.');
            let current = webConfig;
            for(let i = 0; i < keys.length - 1; i++) {
                current = current[keys[i]];
            }
            current[keys[keys.length - 1]] = value;
            renderPreview();
        }

        function triggerUpload(path) {
            if(isViewOnly) return;
            uploadTarget = path;
            document.getElementById('globalUpload').click();
        }

        async function handleGlobalUpload(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            try {
                document.getElementById('loadingOverlay').style.display = 'flex';
                const url = await uploadToCloudinary(file);
                updateConfig(uploadTarget, url);
                renderDesigner();
            } catch (err) {
                alert("Error al subir imagen: " + err.message);
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
            input.value = '';
        }

        async function uploadToCloudinary(file) {
            const user = getLoggedInUser();
            const CLOUD_NAME = "dbbjxhvz5";
            const UPLOAD_PRESET = "Tragalero";
            const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`;
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('folder', `websites/${user?.id || 'anonymous'}`);
            const response = await fetch(url, { method: 'POST', body: formData });
            if (!response.ok) throw new Error("Cloudinary error");
            const data = await response.json();
            return data.secure_url;
        }

        function initSortable() {
            ['promoListContainer', 'menuListContainer', 'testiListContainer', 'aboutFeaturesContainer', 'bannerListContainer', 'blogListContainer'].forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    new Sortable(el, {
                        handle: '.drag-handle',
                        animation: 150,
                        onEnd: (evt) => {
                            let type = id.replace('ListContainer', '').replace('FeaturesContainer', 'Features');
                            if(type === 'promo') type = 'promos';
                            if(type === 'aboutFeatures') {
                                const item = webConfig.about.features.splice(evt.oldIndex, 1)[0];
                                webConfig.about.features.splice(evt.newIndex, 0, item);
                            } else {
                                const item = webConfig[type].splice(evt.oldIndex, 1)[0];
                                webConfig[type].splice(evt.newIndex, 0, item);
                            }
                            renderDesigner();
                            renderPreview();
                        }
                    });
                }
            });
        }

                        .blog-card .card-content { padding: 30px; }
                        .card-meta-wrapper { display: flex; gap: 20px; margin-bottom: 15px; font-size: 0.9rem; }
                        .card-meta-link { display: flex; align-items: center; gap: 5px; }
                        .blog-card .card-title { font-size: 1.5rem; margin-bottom: 15px; text-decoration: none; color: var(--rich-black-fogra-29); display: block; }
                        .btn-link { color: var(--rich-black-fogra-29); font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 5px; margin-top: 20px; }

                        /* Footer */
                        .footer { padding: 80px 0; background: #111; color: #aaa; text-align: center; }
                        .footer .logo { color: white; margin-bottom: 30px; display: inline-block; }
                        .footer p { margin-bottom: 10px; }
                    </style>
                </head>
                <body>

                                <ul class="promo-list">${promosHtml}</ul>
                            </div>
                        </section>
                        <section class="section about" id="about">

                                <div class="about-banner">
                                    <img src="${webConfig.about.img}" alt="About" style="width: 100%;">
                                </div>
                                <div class="about-content">
                                    <h2 class="h2">${escapeHtml(webConfig.about.title)}</h2>
                                    <p>${escapeHtml(webConfig.about.text)}</p>
                                    <ul class="about-list">${aboutFeaturesHtml}</ul>
                                    <button class="btn" style="margin-top: 30px;">Order Now</button>
                                </div>

                        </section>
                        <section class="section food-menu" id="food-menu">
                            <div class="container">
                                <p style="color: var(--cinnabar); font-weight: 600;">Popular Dishes</p>
                                <h2 class="h2">Our Delicious <span style="color:var(--deep-saffron)">Foods</span></h2>
                                <ul class="food-menu-list">${menuHtml}</ul>
                            </div>
                        </section>
                        <section class="section cta" style="background-image: url('${webConfig.hero.bgImg}')">
                            <div class="container">
                                <div class="cta-content">
                                    <h2 class="h2">${escapeHtml(webConfig.cta.title)}</h2>
                                    <p>${escapeHtml(webConfig.cta.text)}</p>
                                    <button class="btn" style="margin-top:20px;">Order Now</button>
                                </div>
                                <div class="cta-banner">
                                    <img src="${webConfig.cta.img}" alt="CTA" style="width: 100%;">
                                </div>
                            </div>
                        </section>
                        <section class="section delivery">
                            <div class="container">
                                <div class="delivery-content">

                        <section class="section testi">

                                <ul class="testi-list">${testiHtml}</ul>
                            </div>

                        <section class="section banner">
                            <div class="container">
                                <ul class="banner-list">${bannersHtml}</ul>

                    </main>
                    <footer class="footer">
                        <div class="container">

                                <p><i class="bi bi-envelope"></i> ${escapeHtml(webConfig.footer.email)}</p>
                                <p><i class="bi bi-telephone"></i> ${escapeHtml(webConfig.footer.phone)}</p>

                </body>
                </html>
            `;
            doc.open();
            doc.write(fullHtml);
            doc.close();
        }

        async function saveWebsite() {
            const user = getLoggedInUser();
            const btn = document.getElementById('saveWebBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Guardando...';

            try {
                const { error } = await supabaseClient
                    .from('user_websites')
                    .upsert([{ user_id: user.id, config: webConfig }], { onConflict: 'user_id' });

                if (error) throw error;
                alert("Sitio web guardado con éxito");
            } catch (err) {
                console.error("Error saving website:", err);
                alert("Error al guardar: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-cloud-arrow-up me-2"></i>Guardar';
            }
        }

        async function loadWebsite() {
            const targetId = viewUserId || getLoggedInUser()?.id;
            if (!targetId) return;

            try {
                const { data, error } = await supabaseClient
                    .from('user_websites')
                    .select('config')
                    .eq('user_id', targetId)
                    .single();

                if (data && data.config) {
                    webConfig = data.config;
                    if (!isViewOnly) renderDesigner();
                    renderPreview();
                }
            } catch (err) {
                console.error("Error loading website:", err);
            }
        }

        function shareWebsite() {
            const user = getLoggedInUser();
            const publicUrl = window.location.origin + window.location.pathname + '?user=' + user.id;
            prompt("Copia este enlace para compartir tu sitio web:", publicUrl);
        }

        window.onload = async () => {
            const user = getLoggedInUser();
            if (!isViewOnly && !user) {
                window.location.href = './login.html';
                return;
            }

            if (isViewOnly) {
                document.querySelector('.designer-sidebar').style.display = 'none';
                document.getElementById('previewControls').style.display = 'none';
                document.querySelector('.preview-area').style.padding = '0';
                document.getElementById('previewFrame').style.maxWidth = '100%';
                document.getElementById('previewFrame').style.borderRadius = '0';
                document.querySelector('nav').style.display = 'none';
                document.body.style.backgroundColor = 'white';
            } else {
                renderUserMenu('authButtons');
                renderDesigner();
            }

            await loadWebsite();
            renderPreview();
            document.getElementById('loadingOverlay').style.display = 'none';
        }
    </script>
</body>

</html>
