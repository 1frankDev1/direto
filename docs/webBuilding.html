<!DOCTYPE html>
<html data-bs-theme="light" lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Web Builder - Tragalero</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto:wght@400;500&family=Rubik:wght@400;500;600;700&family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/pastel-theme.css">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .builder-container { display: flex; height: calc(100vh - 60px); overflow: hidden; }
        .designer-sidebar { width: 450px; min-width: 450px; background: white; border-right: 1px solid #dee2e6; overflow-y: auto; display: flex; flex-direction: column; z-index: 100; }
        .preview-area { flex-grow: 1; background: #e9ecef; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; position: relative; }
        .preview-frame { width: 100%; max-width: 1200px; background: white; box-shadow: 0 10px 40px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; min-height: 100%; transform-origin: top center; transition: transform 0.3s ease; }
        .preview-controls { position: sticky; top: -20px; background: white; padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; z-index: 50; display: flex; gap: 15px; }
        .designer-header { padding: 20px; border-bottom: 1px solid #eee; background: #fff; position: sticky; top: 0; z-index: 110; }
        .template-switcher { background: #f8f9fa; border-radius: 12px; padding: 10px; margin-top: 10px; }
        .accordion-button:not(.collapsed) { background-color: rgba(var(--bs-primary-rgb), 0.1); color: var(--bs-primary); }
        .designer-section { padding: 15px; }
        .form-label { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: #6c757d; }
        .upload-drop-zone { border: 2px dashed #dee2e6; border-radius: 12px; padding: 20px; text-align: center; background: #f8f9fa; cursor: pointer; transition: all 0.2s; margin-bottom: 15px; }
        .upload-drop-zone:hover { border-color: var(--bs-primary); background: rgba(var(--bs-primary-rgb), 0.02); }
        .list-item-editor { background: #fff; border: 1px solid #dee2e6; border-radius: 12px; padding: 15px; margin-bottom: 15px; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .list-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: move; }
        .drag-handle { color: #dee2e6; font-size: 1.2rem; }
        .preview-mobile { width: 375px; }
        .preview-tablet { width: 768px; }
        .preview-desktop { width: 100%; max-width: 1200px; }
        #loadingOverlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    </style>
</head>

<body>
    <div id="loadingOverlay"><div class="spinner-border text-primary"></div></div>

    <nav class="navbar navbar-expand-lg border-bottom bg-white" style="height: 60px;">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="./admin.html">Web Builder</a>
            <div class="ms-auto d-flex align-items-center">
                <div id="authButtons" class="me-3"></div>
                <button class="btn btn-primary fw-bold" id="saveWebBtn" onclick="saveWebsite()"><i class="bi bi-cloud-arrow-up me-2"></i>Guardar</button>
                <button class="btn btn-dark fw-bold ms-2" onclick="shareWebsite()"><i class="bi bi-share me-2"></i>Compartir</button>
            </div>
        </div>
    </nav>

    <div class="builder-container">
        <div class="designer-sidebar">
            <div class="designer-header">
                <h6 class="fw-bold mb-1">Editor de Sitio Web</h6>
                <div class="template-switcher">
                    <label class="form-label small mb-1">Seleccionar Plantilla</label>
                    <select class="form-select form-select-sm" id="templateSelect" onchange="changeTemplate(this.value)">
                        <option value="foodie">Foodie (Restaurante)</option>
                        <option value="pro">Professional (Personal/Card)</option>
                    </select>
                </div>
            </div>

            <div class="accordion accordion-flush" id="builderAccordion">
                <!-- Config General (Foodie) -->
                <div class="accordion-item" data-template="foodie">
                    <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseGeneral">Configuración General</button></h2>
                    <div id="collapseGeneral" class="accordion-collapse collapse" data-bs-parent="#builderAccordion"><div class="designer-section">
                        <label class="form-label">Menutech CUID</label><input type="text" class="form-control mb-2" id="inputCUID" oninput="updateConfig('general.cuid', this.value)">
                        <label class="form-label">Menutech RUID</label><input type="text" class="form-control mb-2" id="inputRUID" oninput="updateConfig('general.ruid', this.value)">
                        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="inputHasRes" onchange="updateConfig('general.hasReservation', this.checked)"><label class="form-check-label">Habilitar Reservas</label></div>
                    </div></div>
                </div>

                <!-- Cabecera (Both) -->
                <div class="accordion-item" data-template="foodie pro">
                    <h2 class="accordion-header"><button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseHeader">Cabecera & Logo</button></h2>
                    <div id="collapseHeader" class="accordion-collapse collapse show" data-bs-parent="#builderAccordion"><div class="designer-section">
                        <label class="form-label">Nombre/Logo</label><input type="text" class="form-control mb-2" id="inputLogo" oninput="updateConfig('header.logo', this.value)">
                        <label class="form-label">Texto Botón</label><input type="text" class="form-control mb-2" id="inputBtnText" oninput="updateConfig('header.btnText', this.value)">
                    </div></div>
                </div>

                <!-- Perfil (Pro) -->
                <div class="accordion-item" data-template="pro">
                    <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePersonal">Perfil Personal</button></h2>
                    <div id="collapsePersonal" class="accordion-collapse collapse" data-bs-parent="#builderAccordion"><div class="designer-section">
                        <label class="form-label">Nombre</label><input type="text" class="form-control mb-2" id="inputProName" oninput="updateConfig('name', this.value)">
                        <label class="form-label">Bio</label><textarea class="form-control mb-2" id="inputProBio" rows="3" oninput="updateConfig('bio', this.value)"></textarea>
                        <div class="upload-drop-zone" onclick="triggerUpload('profilePic')">Cambiar Foto</div>
                    </div></div>
                </div>

                <!-- Hero (Foodie) -->
                <div class="accordion-item" data-template="foodie">
                    <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseHero">Hero / Portada</button></h2>
                    <div id="collapseHero" class="accordion-collapse collapse" data-bs-parent="#builderAccordion"><div class="designer-section">
                        <label class="form-label">Título</label><input type="text" class="form-control mb-2" id="inputHeroTitle" oninput="updateConfig('hero.title', this.value)">
                        <label class="form-label">Subtítulo</label><input type="text" class="form-control mb-2" id="inputHeroSubtitle" oninput="updateConfig('hero.subtitle', this.value)">
                        <textarea class="form-control mb-2" id="inputHeroText" oninput="updateConfig('hero.text', this.value)"></textarea>
                        <div class="upload-drop-zone" onclick="triggerUpload('hero.bannerImg')">Cambiar Banner</div>
                    </div></div>
                </div>

                <!-- Portfolio (Pro) -->
                <div class="accordion-item" data-template="pro">
                    <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePortfolio">Portafolio</button></h2>
                    <div id="collapsePortfolio" class="accordion-collapse collapse" data-bs-parent="#builderAccordion"><div class="designer-section">
                        <div class="row g-2">
                            <div class="col-6"><div class="upload-drop-zone p-2" onclick="triggerUpload('portfolio.0')">Img 1</div></div>
                            <div class="col-6"><div class="upload-drop-zone p-2" onclick="triggerUpload('portfolio.1')">Img 2</div></div>
                            <div class="col-6"><div class="upload-drop-zone p-2" onclick="triggerUpload('portfolio.2')">Img 3</div></div>
                            <div class="col-6"><div class="upload-drop-zone p-2" onclick="triggerUpload('portfolio.3')">Img 4</div></div>
                        </div>
                    </div></div>
                </div>

                <!-- Listas (Foodie) -->
                <div class="accordion-item" data-template="foodie">
                    <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePromo">Promociones</button></h2>
                    <div id="collapsePromo" class="accordion-collapse collapse" data-bs-parent="#builderAccordion"><div class="designer-section">
                        <div id="promoList"></div><button class="btn btn-sm btn-outline-primary w-100" onclick="addItem('promos')">Añadir</button>
                    </div></div>
                </div>

                <!-- Footer (Both) -->
                <div class="accordion-item" data-template="foodie pro">
                    <h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseFooter">Pie de Página</button></h2>
                    <div id="collapseFooter" class="accordion-collapse collapse" data-bs-parent="#builderAccordion"><div class="designer-section">
                        <label class="form-label">Texto</label><textarea class="form-control mb-2" id="inputFooterText" oninput="updateConfig('footer.text', this.value)"></textarea>
                        <label class="form-label">WhatsApp</label><input type="text" class="form-control mb-2" id="inputWA" oninput="updateConfig('socials.whatsapp', this.value)">
                    </div></div>
                </div>
            </div>
            <input type="file" id="globalUpload" style="display:none;" onchange="handleGlobalUpload(this)">
        </div>

        <div class="preview-area">
            <div class="preview-controls">
                <button class="btn btn-sm btn-outline-secondary rounded-pill active" onclick="setPreviewSize('desktop')">Desktop</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="setPreviewSize('tablet')">Tablet</button>
                <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="setPreviewSize('mobile')">Mobile</button>
            </div>
            <div class="preview-frame"><iframe id="templateIframe" style="width: 100%; height: 100%; border: none;"></iframe></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="./assets/js/supabase_logic.js"></script>

    <script>
        let webConfig = { template: 'foodie', header: {logo: 'Foodie', btnText: 'Order'}, hero: {title: '', subtitle: '', text: ''}, promos: [], socials: {whatsapp: ''}, footer: {text: ''}, name: '', bio: '', portfolio: ['', '', '', ''] };
        let uploadTarget = null;

        function updateConfig(path, value) {
            const keys = path.split('.');
            let curr = webConfig;
            for(let i=0; i<keys.length-1; i++) { if(!curr[keys[i]]) curr[keys[i]] = {}; curr = curr[keys[i]]; }
            curr[keys[keys.length-1]] = value;
            renderPreview();
        }

        async function changeTemplate(tid) {
            webConfig.template = tid;
            const iframe = document.getElementById('templateIframe');
            iframe.src = tid === 'foodie' ? 'template1.html' : 'template2.html';
            document.querySelectorAll('#builderAccordion .accordion-item').forEach(item => {
                const allowed = item.dataset.template || 'foodie';
                item.style.display = allowed.includes(tid) ? 'block' : 'none';
            });
            renderDesigner();
            iframe.onload = () => renderPreview();
        }

        function renderDesigner() {
            document.getElementById('inputLogo').value = webConfig.header?.logo || '';
            document.getElementById('inputBtnText').value = webConfig.header?.btnText || '';
            if(webConfig.template === 'foodie') {
                document.getElementById('inputHeroTitle').value = webConfig.hero?.title || '';
                document.getElementById('inputHeroSubtitle').value = webConfig.hero?.subtitle || '';
                document.getElementById('inputHeroText').value = webConfig.hero?.text || '';
            } else {
                document.getElementById('inputProName').value = webConfig.name || '';
                document.getElementById('inputProBio').value = webConfig.bio || '';
            }
            document.getElementById('inputFooterText').value = webConfig.footer?.text || '';
            document.getElementById('inputWA').value = webConfig.socials?.whatsapp || '';
            renderListContainers();
        }

        function renderListContainers() {
            const promoCont = document.getElementById('promoList');
            if(promoCont) {
                promoCont.innerHTML = (webConfig.promos || []).map((p, i) => `
                    <div class="list-item-editor" data-index="${i}">
                        <input type="text" class="form-control form-control-sm mb-1" value="${p.title}" oninput="webConfig.promos[${i}].title = this.value; renderPreview()">
                        <button class="btn btn-sm btn-link text-danger p-0" onclick="webConfig.promos.splice(${i},1); renderDesigner(); renderPreview()">Eliminar</button>
                    </div>
                `).join('');
            }
        }

        function addItem(type) {
            if(type === 'promos') webConfig.promos.push({ title: 'Nueva Promo', text: '', img: 'https://via.placeholder.com/300' });
            renderDesigner();
            renderPreview();
        }

        function renderPreview() {
            const iframe = document.getElementById('templateIframe');
            if(iframe.contentWindow) iframe.contentWindow.postMessage({ type: 'update', config: webConfig }, '*');
        }

        async function saveWebsite() {
            const user = getLoggedInUser();
            if(!user) return alert("Inicia sesión");
            try {
                const { error } = await supabaseClient.from('user_websites').upsert([{ user_id: user.id, config: webConfig }], { onConflict: 'user_id' });
                if(error) throw error; alert("Guardado");
            } catch(e) { alert(e.message); }
        }

        async function loadWebsite() {
            const user = getLoggedInUser();
            if(!user) return;
            const { data } = await supabaseClient.from('user_websites').select('config').eq('user_id', user.id).single();
            if(data?.config) {
                webConfig = data.config;
                document.getElementById('templateSelect').value = webConfig.template;
                changeTemplate(webConfig.template);
            }
        }

        function triggerUpload(path) { uploadTarget = path; document.getElementById('globalUpload').click(); }
        async function handleGlobalUpload(input) {
            if(!input.files?.[0]) return;
            const url = "https://via.placeholder.com/600"; // Mock upload
            updateConfig(uploadTarget, url); renderDesigner();
        }

        function setPreviewSize(s) { document.querySelector('.preview-frame').className = 'preview-frame preview-' + s; }

        window.addEventListener('message', (e) => {
            if(e.data.type === 'selectSection') {
                const map = { 'personal': 'collapsePersonal', 'hero': 'collapseHero', 'promos': 'collapsePromo' };
                const el = document.getElementById(map[e.data.section] || 'collapseHeader');
                if(el) bootstrap.Collapse.getOrCreateInstance(el).show();
            }
        });

        window.onload = async () => {
            if(!getLoggedInUser()) { window.location.href = './login.html'; return; }
            await loadWebsite();
            if(!webConfig.template) changeTemplate('foodie');
            document.getElementById('loadingOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
