<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --primary: #333; --bg: #f4f7f6; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg); color: #333; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        header { background: var(--primary); color: white; padding: 20px; text-align: center; font-weight: 600; font-size: 1.4rem; }
        .hero { padding: 40px 20px; text-align: center; }
        .profile-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 5px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .name { font-size: 2.2rem; font-weight: 600; margin: 0; color: var(--primary); }
        .bio { color: #666; margin: 15px 0 25px; font-size: 1.1rem; max-width: 80%; margin-inline: auto; }
        .social-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .social-links a { font-size: 1.8rem; color: var(--primary); transition: transform 0.2s; }
        .social-links a:hover { transform: scale(1.2); }
        .section { padding: 40px 20px; border-top: 1px solid #eee; }
        .section-title { font-weight: 600; margin-bottom: 20px; display: block; text-transform: uppercase; font-size: 0.9rem; color: #999; letter-spacing: 1px; }
        .video-container { width: 100%; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 16/9; }
        .portfolio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .portfolio-item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; transition: transform 0.3s; }
        .portfolio-item img:hover { transform: scale(1.03); }
        .ba-slider { position: relative; width: 100%; aspect-ratio: 4/3; border-radius: 12px; overflow: hidden; cursor: col-resize; }
        .ba-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .ba-before { z-index: 2; width: 50%; border-right: 3px solid white; }
        .ba-handle { position: absolute; top: 50%; left: 50%; width: 44px; height: 44px; background: white; border-radius: 50%; transform: translate(-50%, -50%); z-index: 3; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); pointer-events: none; color: var(--primary); font-size: 1.2rem; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 600; font-size: 1.1rem; cursor: pointer; transition: opacity 0.2s; margin-bottom: 10px; }
        .btn-main:hover { opacity: 0.9; }
        footer { padding: 40px 20px; text-align: center; color: #999; font-size: 0.9rem; border-top: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <header>Nombre del Profesional</header>
        <div class="hero">
            <img src="https://tragalero.com/assets/img/tragalero.png" class="profile-img">
            <h1 class="name">Tu Nombre Aquí</h1>
            <p class="bio">Breve descripción sobre ti y lo que haces. Especialista en crear experiencias únicas.</p>
            <div class="social-links">
                <a href="#"><i class="bi bi-whatsapp"></i></a>
                <a href="#"><i class="bi bi-instagram"></i></a>
                <a href="#"><i class="bi bi-linkedin"></i></a>
            </div>
            <button class="btn-main">CONTACTAR AHORA</button>
        </div>

        <div class="section">
            <span class="section-title">Video de Presentación</span>
            <div class="video-container">
                <video src="https://www.w3schools.com/html/mov_bbb.mp4" controls width="100%"></video>
            </div>
        </div>

        <div class="section">
            <span class="section-title">Portafolio</span>
            <div class="portfolio-grid">
                <div class="portfolio-item"><img src="https://picsum.photos/id/1/600/600"></div>
                <div class="portfolio-item"><img src="https://picsum.photos/id/2/600/600"></div>
                <div class="portfolio-item"><img src="https://picsum.photos/id/3/600/600"></div>
                <div class="portfolio-item"><img src="https://picsum.photos/id/4/600/600"></div>
            </div>
        </div>

        <div class="section">
            <span class="section-title">Antes & Después</span>
            <div class="ba-slider" id="baSlider">
                <img src="https://picsum.photos/id/11/800/600" class="ba-img">
                <div class="ba-before" id="baBefore">
                    <img src="https://picsum.photos/id/10/800/600" class="ba-img">
                </div>
                <div class="ba-handle" id="baHandle">
                    <i class="bi bi-arrows-left-right"></i>
                </div>
            </div>
        </div>

        <footer>
            <p>123 Calle Principal, Ciudad</p>
            <p>info@profesional.com | +1 234 567 890</p>
            <p style="margin-top:20px;">&copy; 2024 Tragalero</p>
        </footer>
    </div>

    <script>
        const slider = document.getElementById('baSlider');
        const before = document.getElementById('baBefore');
        const handle = document.getElementById('baHandle');

        function moveSlider(e) {
            const rect = slider.getBoundingClientRect();
            let x = (e.pageX || (e.touches ? e.touches[0].pageX : 0)) - rect.left;
            if (x < 0) x = 0;
            if (x > rect.width) x = rect.width;
            let percent = (x / rect.width) * 100;
            before.style.width = percent + '%';
            handle.style.left = percent + '%';
        }

        if (slider) {
            slider.addEventListener('mousemove', moveSlider);
            slider.addEventListener('touchmove', moveSlider);
        }
    </script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
