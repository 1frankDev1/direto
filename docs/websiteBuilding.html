<!DOCTYPE html>
<html data-bs-theme="light" lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Website Builder - Tragalero</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Roboto:wght@400;500&family=Rubik:wght@400;500;600;700&family=Shadows+Into+Light&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/pastel-theme.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }

        /* Builder Layout */
        .builder-container {
            display: flex;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        .designer-sidebar {
            width: 450px;
            min-width: 450px;
            background: white;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .preview-area {
            flex-grow: 1;
            background: #e9ecef;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        .preview-frame {
            width: 100%;
            max-width: 1200px;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            min-height: 100%;
            transform-origin: top center;
            transition: transform 0.3s ease;
        }

        .preview-controls {
            position: sticky;
            top: -20px;
            background: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            z-index: 50;
            display: flex;
            gap: 15px;
        }

        /* Designer Components */
        .designer-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .accordion-button:not(.collapsed) {
            background-color: rgba(var(--bs-primary-rgb), 0.1);
            color: var(--bs-primary);
        }

        .designer-section {
            padding: 15px;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #6c757d;
        }

        .upload-drop-zone {
            border: 2px dashed #dee2e6;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 15px;
        }

        .upload-drop-zone:hover {
            border-color: var(--bs-primary);
            background: rgba(var(--bs-primary-rgb), 0.02);
        }

        .upload-drop-zone i {
            font-size: 1.2rem;
            color: #adb5bd;
            display: block;
            margin-bottom: 4px;
        }

        .list-item-editor {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .list-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            cursor: move;
        }

        .drag-handle {
            color: #dee2e6;
            font-size: 1.2rem;
        }

        .item-actions {
            display: flex;
            gap: 5px;
        }

        /* Responsive Previews */
        .preview-mobile { width: 375px; }
        .preview-tablet { width: 768px; }
        .preview-desktop { width: 100%; max-width: 1200px; }

        /* Loader */
        #loadingOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .highlight-edit {
            background-color: #fff3cd !important;
            transition: background-color 1s ease;
        }
    </style>
</head>

<body>

        </div>
    </div>

                        { sel: '.card-banner img', id: 'img', type: 'image', label: 'Imagen' },
                        { sel: '.badge', id: 'category', type: 'text', label: 'Categoría' },
                        { sel: 'time', id: 'date', type: 'text', label: 'Fecha' },
                        { sel: '.meta-info:not(time)', id: 'author', type: 'text', label: 'Autor' },
                        { sel: '.card-title', id: 'title', type: 'text', label: 'Título' },
                        { sel: '.card-text', id: 'text', type: 'text', label: 'Resumen' }
                    ]},
                    { sel: '.footer-list:nth-of-type(1)', section: 'footer', id: 'contact_info', type: 'list', label: 'Info Contacto', blueprint: 'contact-item', itemSel: 'li:not(:first-child)', fields: [
                        { sel: '.footer-list-item', id: 'text', type: 'text', label: 'Texto' }
                    ]},
                    { sel: '.footer-list:nth-of-type(2)', section: 'footer', id: 'opening_hours', type: 'list', label: 'Horarios', blueprint: 'hour-item', itemSel: 'li:not(:first-child)', fields: [
                        { sel: '.footer-list-item', id: 'text', type: 'text', label: 'Horario' }
                    ]}
                ]
            }
        };

        // Current state
        let webConfig = {
            template: 'plantilla1.html',
            data: {} // Holds section-based data
        };

        let uploadTarget = null;
        let templateBlueprints = {}; // Stores <template> content from iframe

        // --- Core Functions ---

        async function init() {
            try {
                if (!isViewOnly) {
                    const user = getLoggedInUser();
                    if (!user) { window.location.href = './login.html'; return; }
                    renderUserMenu('authButtons');
                } else {
                    document.querySelector('.designer-sidebar').style.display = 'none';
                    document.getElementById('previewControls').style.display = 'none';
                    document.querySelector('.preview-area').style.padding = '0';
                    document.getElementById('previewFrame').style.maxWidth = '100%';
                    document.getElementById('previewFrame').style.borderRadius = '0';
                    document.querySelector('nav').style.display = 'none';
                    document.body.style.backgroundColor = 'white';
                }

                await loadWebsite();

                const iframe = document.getElementById('templateIframe');
                iframe.src = webConfig.template;

                iframe.addEventListener('load', () => {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    dynamicallyInstrument(doc, webConfig.template);
                    scanTemplate();
                    if (!isViewOnly) buildSidebar();
                    injectData();
                    document.getElementById('loadingOverlay').style.display = 'none';
                });

            } catch (err) {
                console.error("Init error:", err);
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        /**
         * Applies data-attributes and fixes paths in clean templates.
         */
        function dynamicallyInstrument(doc, templateName) {
            const config = instrumentationMap[templateName];
            if (!config) return;

            // Fix paths
            if (config.baseAssetUrl) {
                // Remove existing base if any
                const existingBase = doc.querySelector('base');
                if (existingBase) existingBase.remove();

                const base = doc.createElement('base');
                base.href = config.baseAssetUrl;
                doc.head.prepend(base);

                // Rewrite attributes to be relative to base
                doc.querySelectorAll('link, img, script, source').forEach(el => {
                    ['src', 'href', 'poster'].forEach(attr => {
                        const val = el.getAttribute(attr);
                        if (val && (val.startsWith('./') || val.startsWith('../'))) {
                            el.setAttribute(attr, val.replace(/^\.\//, '').replace(/^\.\.\//, 'assets/'));
                        }
                    });
                });

                // Fix CSS in style tags and inline
                doc.querySelectorAll('style').forEach(style => {
                    style.textContent = style.textContent
                        .replace(/url\(['"]?\.\//g, "url('")
                        .replace(/url\(['"]?\.\.\//g, "url('assets/");
                });
                doc.querySelectorAll('[style*="url("]').forEach(el => {
                    el.setAttribute('style', el.getAttribute('style')
                        .replace(/url\(['"]?\.\//g, "url('")
                        .replace(/url\(['"]?\.\.\//g, "url('assets/"));
                });
            }

            // Apply sections
            config.sections.forEach(s => {
                const el = doc.querySelector(s.sel);
                if (el) {
                    el.dataset.section = s.id;
                    el.dataset.label = s.label;
                }
            });

            // Apply editables
            config.editables.forEach(e => {
                const el = doc.querySelector(e.sel);
                if (el) {
                    el.dataset.editable = e.type;
                    el.dataset.label = e.label;
                    if (e.id) el.id = e.id;
                    if (e.blueprint) el.dataset.blueprint = e.blueprint;

                    if (e.type === 'list' && e.itemSel && e.fields) {
                        // Instrument existing items
                        const items = el.querySelectorAll(e.itemSel);
                        items.forEach(item => {
                            e.fields.forEach(f => {
                                const fEl = item.querySelector(f.sel);
                                if (fEl) {
                                    fEl.dataset.editable = f.type;
                                    fEl.dataset.label = f.label;
                                    if (f.id) fEl.id = f.id;
                                }
                            });
                        });

                        // Create internal blueprint from first item if not exists
                        if (items.length > 0) {
                            const clone = items[0].cloneNode(true);
                            templateBlueprints[e.blueprint] = clone.outerHTML;
                        }
                    }
                }
            });

            // Inject Click-to-Edit script
            const script = doc.createElement('script');
            script.textContent = `
                document.addEventListener('click', (e) => {
                    const editable = e.target.closest('[data-editable]');
                    if (editable) {
                        const section = editable.closest('[data-section]');
                        window.parent.postMessage({
                            type: 'selectField',
                            section: section ? section.dataset.section : '',
                            field: editable.id || editable.dataset.label
                        }, '*');
                        e.preventDefault();
                        e.stopPropagation();
                    } else {
                        const section = e.target.closest('[data-section]');
                        if (section) {
                            window.parent.postMessage({
                                type: 'selectSection',
                                section: section.dataset.section
                            }, '*');
                        }
                    }
                });
            `;
            doc.body.appendChild(script);
        }

        /**
         * Scans the template for data-section, data-editable and templates.
         */
        function scanTemplate() {
            const iframe = document.getElementById('templateIframe');
            const doc = iframe.contentDocument || iframe.contentWindow.document;

            // Extract explicitly defined blueprints
            doc.querySelectorAll('template[id^="blueprint-"]').forEach(t => {
                const name = t.id.replace('blueprint-', '');
                templateBlueprints[name] = t.innerHTML;
            });

            // Initialize webConfig.data if empty
            if (Object.keys(webConfig.data).length === 0) {
                doc.querySelectorAll('[data-section]').forEach(section => {
                    const sectionId = section.dataset.section;
                    webConfig.data[sectionId] = {};

                    // Include the section itself if it's editable
                    const editables = Array.from(section.querySelectorAll('[data-editable]'));
                    if (section.dataset.editable) editables.unshift(section);

                    editables.forEach(el => {
                        const key = el.id || el.dataset.label;
                        if (!key) return;

                        if (el.dataset.editable === 'list') {
                            webConfig.data[sectionId][key] = extractListItems(el, el.dataset.blueprint);
                        } else {
                            if (el.dataset.editable === 'svg') {
                                webConfig.data[sectionId][key] = el.innerHTML.trim();
                            } else if (el.dataset.editable === 'image') {
                                let val = el.src || el.dataset.bg || '';
                                if (!val && el.style.backgroundImage) {
                                    val = el.style.backgroundImage.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
                                }
                                webConfig.data[sectionId][key] = val;
                            } else {
                                webConfig.data[sectionId][key] = el.textContent.trim();
                            }
                        }
                    });
                });
            }
        }

        function extractListItems(container, blueprintName) {
            const blueprintHtml = templateBlueprints[blueprintName];
            if (!blueprintHtml) return [];

            const parser = new DOMParser();
            const doc = parser.parseFromString(blueprintHtml, 'text/html');
            const editableFields = doc.querySelectorAll('[data-editable]');

            const items = [];
            Array.from(container.children).forEach(itemEl => {
                if (itemEl.nodeType !== 1) return;
                const itemData = {};
                let found = false;
                editableFields.forEach(f => {
                    const fId = f.id || f.dataset.label;
                    const fType = f.dataset.editable;
                    const target = (itemEl.id === fId || itemEl.dataset.label === fId)
                                    ? itemEl
                                    : (itemEl.querySelector(`#${fId}`) || itemEl.querySelector(`[data-label="${fId}"]`));

                    if (target) {
                        found = true;
                        if (fType === 'image') {
                            let val = target.src || target.dataset.bg || '';
                            if (!val && target.style.backgroundImage) {
                                val = target.style.backgroundImage.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
                            }
                            itemData[fId] = val;
                        }
                        else if (fType === 'svg') itemData[fId] = target.innerHTML.trim();
                        else itemData[fId] = target.textContent.trim();
                    }
                });
                if (found) items.push(itemData);
            });
            return items;
        }

        /**
         * Builds the sidebar UI based on webConfig.data and data-editable attributes.
         */
        function buildSidebar() {
            const container = document.getElementById('dynamicSidebar');
            container.innerHTML = '';

            const iframe = document.getElementById('templateIframe');
            const doc = iframe.contentDocument || iframe.contentWindow.document;

            Object.entries(webConfig.data).forEach(([sectionId, fields], index) => {
                const sectionEl = doc.querySelector(`[data-section="${sectionId}"]`);
                if (!sectionEl) return;

                const sectionLabel = sectionEl.dataset.label || sectionId;
                const accordionItem = document.createElement('div');
                accordionItem.className = 'accordion-item';

                const isOpen = index === 0 ? 'show' : '';

                accordionItem.innerHTML = `
                    <h2 class="accordion-header">
                        <button class="accordion-button ${index === 0 ? '' : 'collapsed'}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${sectionId}">
                            ${sectionLabel}
                        </button>
                    </h2>
                    <div id="collapse-${sectionId}" class="accordion-collapse collapse ${isOpen}" data-bs-parent="#dynamicSidebar">
                        <div class="designer-section" id="section-fields-${sectionId}">
                            <!-- Fields will be added here -->
                        </div>
                    </div>
                `;

                container.appendChild(accordionItem);
                const fieldsContainer = accordionItem.querySelector(`#section-fields-${sectionId}`);

                sectionEl.querySelectorAll('[data-editable]').forEach(el => {
                    const fieldId = el.id || el.dataset.label;
                    const type = el.dataset.editable;
                    const label = el.dataset.label || fieldId;

                    if (type === 'list') {
                        const listContainer = document.createElement('div');
                        listContainer.className = 'mb-3';
                        listContainer.innerHTML = `
                            <label class="form-label">${label}</label>
                            <div id="list-items-${sectionId}-${fieldId}"></div>
                            <button class="btn btn-sm btn-outline-primary w-100 mt-2" onclick="addListItem('${sectionId}', '${fieldId}', '${el.dataset.blueprint}')">
                                <i class="bi bi-plus-lg me-1"></i> Añadir item
                            </button>
                        `;
                        fieldsContainer.appendChild(listContainer);
                        renderListItems(sectionId, fieldId, el.dataset.blueprint);
                    } else {
                        const fieldMarkup = buildFieldMarkup(sectionId, fieldId, type, label, webConfig.data[sectionId][fieldId]);
                        fieldsContainer.appendChild(fieldMarkup);
                    }
                });
            });

            initSortables();
        }

        function buildFieldMarkup(sectionId, fieldId, type, label, value) {
            const div = document.createElement('div');
            div.className = 'mb-3 designer-field';
            div.dataset.field = fieldId;
            const uniqueId = `input-${sectionId}-${fieldId}`;

            if (type === 'text') {
                div.innerHTML = `
                    <label class="form-label" for="${uniqueId}">${label}</label>
                    <input type="text" class="form-control form-control-sm" id="${uniqueId}" value="${value || ''}"
                        oninput="updateData('${sectionId}', '${fieldId}', this.value)">
                `;
            } else if (type === 'textarea') {
                div.innerHTML = `
                    <label class="form-label" for="${uniqueId}">${label}</label>
                    <textarea class="form-control form-control-sm" id="${uniqueId}" rows="3"
                        oninput="updateData('${sectionId}', '${fieldId}', this.value)">${value || ''}</textarea>
                `;
            } else if (type === 'image') {
                div.innerHTML = `
                    <label class="form-label" for="${uniqueId}">${label}</label>
                    <div class="upload-drop-zone" onclick="triggerUpload('${sectionId}.${fieldId}')">
                        ${value ? `<img src="${value}" style="max-height: 50px; margin-bottom: 5px;">` : '<i class="bi bi-image"></i>'}
                        <span class="small d-block">Cambiar imagen</span>
                    </div>
                `;
            } else if (type === 'svg') {
                div.innerHTML = `
                    <label class="form-label">${label} (SVG)</label>
                    <textarea class="form-control form-control-sm" rows="3" placeholder="Pegar código <svg>..."
                        oninput="updateData('${sectionId}', '${fieldId}', this.value)">${value || ''}</textarea>
                `;
            }
            return div;
        }

        /**
         * Renders the editor UI for list items using blueprints.
         */
        function renderListItems(sectionId, fieldId, blueprintName) {
            const container = document.getElementById(`list-items-${sectionId}-${fieldId}`);
            if (!container) return;
            container.innerHTML = '';

            const items = webConfig.data[sectionId][fieldId] || [];
            if (items.length === 0) {
                container.innerHTML = '<p class="text-muted small text-center my-3">No hay items. Añade uno nuevo.</p>';
                return;
            }
            const blueprintHtml = templateBlueprints[blueprintName];
            if (!blueprintHtml) return;

            // Parse blueprint to find its editable fields
            const parser = new DOMParser();
            const doc = parser.parseFromString(blueprintHtml, 'text/html');
            const editableFields = doc.querySelectorAll('[data-editable]');

            items.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'list-item-editor';
                itemDiv.dataset.index = index;

                let fieldsHtml = '';
                editableFields.forEach(f => {
                    const fId = f.id || f.dataset.label;
                    const fType = f.dataset.editable;
                    const fLabel = f.dataset.label || fId;
                    const fValue = item[fId] || '';

                    if (fType === 'image') {
                        fieldsHtml += `
                            <div class="upload-drop-zone p-2 mb-2" onclick="triggerUpload('${sectionId}.${fieldId}.${index}.${fId}')">
                                <img src="${fValue || 'https://via.placeholder.com/50'}" style="height: 30px; border-radius: 4px;" class="me-2">
                                <span class="small">Cambiar ${fLabel}</span>
                            </div>`;
                    } else if (fType === 'svg') {
                        fieldsHtml += `<textarea class="form-control form-control-sm mb-2" placeholder="${fLabel} SVG" rows="2" oninput="updateListData('${sectionId}', '${fieldId}', ${index}, '${fId}', this.value)">${fValue}</textarea>`;
                    } else {
                        fieldsHtml += `<input type="text" class="form-control form-control-sm mb-2" placeholder="${fLabel}" value="${fValue}" oninput="updateListData('${sectionId}', '${fieldId}', ${index}, '${fId}', this.value)">`;
                    }
                });

                itemDiv.innerHTML = `
                    <div class="list-item-header">
                        <span class="fw-bold small"><i class="bi bi-grip-vertical me-1 drag-handle"></i> Item ${index + 1}</span>
                        <div class="item-actions">
                            <button class="btn btn-sm btn-outline-danger border-0" onclick="removeListItem('${sectionId}', '${fieldId}', ${index}, '${blueprintName}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                    ${fieldsHtml}
                `;
                container.appendChild(itemDiv);
            });
        }

        // --- Data Update Logic ---

        function updateData(sectionId, fieldId, value) {
            webConfig.data[sectionId][fieldId] = value;
            injectData();
        }

        function updateListData(sectionId, fieldId, index, key, value) {
            webConfig.data[sectionId][fieldId][index][key] = value;
            injectData();
        }

        function addListItem(sectionId, fieldId, blueprintName) {
            const blueprintHtml = templateBlueprints[blueprintName];
            const parser = new DOMParser();
            const doc = parser.parseFromString(blueprintHtml, 'text/html');

            const newItem = {};
            doc.querySelectorAll('[data-editable]').forEach(f => {
                newItem[f.id || f.dataset.label] = (f.dataset.editable === 'image' || f.dataset.editable === 'svg') ? '' : 'Nuevo ' + (f.dataset.label || '');
            });

            webConfig.data[sectionId][fieldId].push(newItem);
            buildSidebar(); // Rebuild sidebar to show new item
            injectData();
        }

        function removeListItem(sectionId, fieldId, index, blueprintName) {
            webConfig.data[sectionId][fieldId].splice(index, 1);
            buildSidebar();
            injectData();
        }

        /**
         * Injects all data from webConfig.data back into the iframe template.
         */
        function injectData() {
            const iframe = document.getElementById('templateIframe');
            const doc = iframe.contentDocument || iframe.contentWindow.document;

            Object.entries(webConfig.data).forEach(([sectionId, fields]) => {
                const sectionEl = doc.querySelector(`[data-section="${sectionId}"]`);
                if (!sectionEl) return;

                Object.entries(fields).forEach(([fieldId, value]) => {
                    const el = (sectionEl.id === fieldId || sectionEl.dataset.label === fieldId)
                                ? sectionEl
                                : (sectionEl.querySelector(`#${fieldId}`) || sectionEl.querySelector(`[data-label="${fieldId}"]`));

                    if (!el) return;

                    const type = el.dataset.editable;

                    if (type === 'list') {
                        renderListInTemplate(el, value, el.dataset.blueprint);
                    } else if (type === 'image') {
                        if (el.tagName === 'IMG') {
                            el.src = value;
                        } else {
                            el.style.backgroundImage = `url('${value}')`;
                            // Ensure background-size is cover for hero/cta
                            el.style.backgroundSize = 'cover';
                            el.style.backgroundPosition = 'center';
                        }
                    } else if (type === 'svg') {
                        el.innerHTML = sanitizeSvg(value);
                    } else {
                        el.textContent = value;
                    }
                });
            });

            // Re-init template components
            if(iframe.contentWindow.MenutechUI) iframe.contentWindow.MenutechUI.init();
            if(typeof iframe.contentWindow.glfBindButtons === 'function') iframe.contentWindow.glfBindButtons();
        }

        function renderListInTemplate(container, data, blueprintName) {
            const blueprintHtml = templateBlueprints[blueprintName];
            if (!blueprintHtml) return;

            container.innerHTML = '';
            data.forEach(item => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(blueprintHtml, 'text/html');
                const itemEl = doc.body.firstElementChild;

                Object.entries(item).forEach(([key, val]) => {
                    const target = itemEl.querySelector(`#${key}`) || itemEl.querySelector(`[data-label="${key}"]`) || ( (itemEl.id === key || itemEl.dataset.label === key) ? itemEl : null );
                    if (!target) return;

                    const type = target.dataset.editable;
                    if (type === 'image') {
                        if (target.tagName === 'IMG') {
                            target.src = val;
                        } else {
                            target.style.backgroundImage = `url('${val}')`;
                            target.style.backgroundSize = 'cover';
                            target.style.backgroundPosition = 'center';
                        }
                    }
                    else if (type === 'svg') target.innerHTML = sanitizeSvg(val);
                    else target.textContent = val;
                });

                container.appendChild(itemEl);
            });
        }

        // --- Event Handlers ---

        function setPreviewSize(size, btn) {
            const frame = document.getElementById('previewFrame');
            frame.className = 'preview-frame preview-' + size;
            document.querySelectorAll('.preview-controls button').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }

        function triggerUpload(path) {
            uploadTarget = path;
            document.getElementById('globalUpload').click();
        }

        async function handleGlobalUpload(input) {
            if (!input.files || !input.files[0]) return;
            try {
                document.getElementById('loadingOverlay').style.display = 'flex';
                const url = await uploadToCloudinary(input.files[0]);

                const parts = uploadTarget.split('.');
                if (parts.length === 2) {
                    // Normal field: section.field
                    updateData(parts[0], parts[1], url);
                } else if (parts.length === 4) {
                    // List item: section.list.index.field
                    updateListData(parts[0], parts[1], parseInt(parts[2]), parts[3], url);
                }

                buildSidebar();
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
                input.value = '';
            }
        }

        async function uploadToCloudinary(file) {
            const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`;
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            const response = await fetch(url, { method: 'POST', body: formData });
            if (!response.ok) throw new Error("Cloudinary upload failed");
            const data = await response.json();
            return data.secure_url;
        }

        function initSortables() {
            document.querySelectorAll('[id^="list-items-"]').forEach(el => {
                new Sortable(el, {
                    handle: '.drag-handle',
                    animation: 150,
                    onEnd: (evt) => {
                        const parts = el.id.replace('list-items-', '').split('-');
                        const sectionId = parts[0];
                        const fieldId = parts[1];

                        const items = webConfig.data[sectionId][fieldId];
                        const moved = items.splice(evt.oldIndex, 1)[0];
                        items.splice(evt.newIndex, 0, moved);

                        injectData();
                        buildSidebar();
                    }
                });
            });
        }

        window.addEventListener('message', (event) => {
            if (event.data.type === 'selectSection' || event.data.type === 'selectField') {
                const sectionId = event.data.section;
                const fieldId = event.data.field;
                const collapseEl = document.getElementById(`collapse-${sectionId}`);

                if (collapseEl) {
                    bootstrap.Collapse.getOrCreateInstance(collapseEl).show();
                    collapseEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

                    // Visual feedback for section
                    const content = collapseEl.querySelector('.designer-section');
                    content.classList.add('highlight-edit');
                    setTimeout(() => content.classList.remove('highlight-edit'), 1000);

                    // If it's a field, highlight the specific input
                    if (fieldId) {
                        setTimeout(() => {
                            const fieldEl = collapseEl.querySelector(`[data-field="${fieldId}"]`) ||
                                          collapseEl.querySelector(`#list-items-${sectionId}-${fieldId}`);
                            if (fieldEl) {
                                fieldEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                fieldEl.classList.add('highlight-edit');
                                setTimeout(() => fieldEl.classList.remove('highlight-edit'), 1000);
                            }
                        }, 300);
                    }
                }
            }
        });

        // --- Persistence ---

        async function saveWebsite() {
            const user = getLoggedInUser();
            const btn = document.getElementById('saveWebBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Guardando...';
            try {
                const { error } = await supabaseClient.from('user_websites').upsert([{ user_id: user.id, config: webConfig }], { onConflict: 'user_id' });
                if (error) throw error;
                alert("Sitio web guardado con éxito");
            } catch (err) {
                alert("Error al guardar: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-cloud-arrow-up me-2"></i>Guardar';
            }
        }

        async function loadWebsite() {
            const targetId = viewUserId || getLoggedInUser()?.id;
            if (!targetId) return;
            try {
                const { data } = await supabaseClient.from('user_websites').select('config').eq('user_id', targetId).single();
                if (data && data.config) {
                    webConfig = data.config;
                    if(document.getElementById('selectTemplate')) document.getElementById('selectTemplate').value = webConfig.template;
                }
            } catch (err) { console.error("Error loading website:", err); }
        }

        function shareWebsite() {
            const user = getLoggedInUser();
            const publicUrl = window.location.origin + window.location.pathname + '?user=' + user.id;
            prompt("Copia este enlace para compartir tu sitio web:", publicUrl);
        }

        function changeTemplate(val) {
            if (confirm("Al cambiar de plantilla podrías perder algunos datos personalizados. ¿Continuar?")) {
                webConfig.template = val;
                webConfig.data = {}; // Force re-scan
                window.location.reload();
            }
        }

        function sanitizeSvg(svgString) {
            if (!svgString) return '';
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(svgString, 'image/svg+xml');
                const errorNode = doc.querySelector('parsererror');
                if (errorNode) return '';
                const svg = doc.querySelector('svg');
                if (!svg) return '';
                // Simple stripping of scripts
                svg.querySelectorAll('script').forEach(s => s.remove());
                return svg.outerHTML;
            } catch (e) { return ''; }
        }

        window.onload = init;
    </script>
</body>
</html>
